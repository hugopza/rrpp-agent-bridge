name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[deployment,quality]"
      - name: Static checks
        run: |
          ruff check rrpp_bridge tests
          mypy rrpp_bridge
          bandit -q -r rrpp_bridge -s B404,B603
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Package
        run: python -m build
      - name: Dependency audit
        run: pip-audit
